<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Badge Background -->
  <path d="M150 50 L210 85 L210 155 L150 190 L90 155 L90 85 Z" fill="url(#mainGradient)" opacity="0.15"/>
  
  <!-- Central AI Brain Core -->
  <circle cx="150" cy="120" r="30" fill="url(#mainGradient)" opacity="0.3"/>
  <circle cx="150" cy="120" r="20" fill="url(#mainGradient)"/>
  
  <!-- Neural Network Nodes -->
  <circle cx="120" cy="90" r="8" fill="#06b6d4"/>
  <circle cx="180" cy="90" r="8" fill="#3b82f6"/>
  <circle cx="120" cy="150" r="8" fill="#3b82f6"/>
  <circle cx="180" cy="150" r="8" fill="#8b5cf6"/>
  
  <!-- Connection Lines -->
  <line x1="150" y1="120" x2="120" y2="90" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="120" x2="180" y2="90" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="120" x2="120" y2="150" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="120" x2="180" y2="150" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Outer Agent Nodes -->
  <circle cx="105" cy="70" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="195" cy="70" r="6" fill="#22d3ee" opacity="0.8"/>
  <circle cx="105" cy="170" r="6" fill="#a855f7" opacity="0.8"/>
  <circle cx="195" cy="170" r="6" fill="#a855f7" opacity="0.8"/>
  
  <!-- Automation Flow Arrows -->
  <path d="M210 100 L230 100 L225 95 M230 100 L225 105" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <path d="M210 140 L230 140 L225 135 M230 140 L225 145" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  
  <!-- AI Spark Effect -->
  <circle cx="150" cy="120" r="12" fill="white" opacity="0.6">
    <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text -->
  <text x="280" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="url(#textGradient)" letter-spacing="-2">Agentify</text>
  <text x="280" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" letter-spacing="1">AI-POWERED AUTOMATION</text>
</svg>